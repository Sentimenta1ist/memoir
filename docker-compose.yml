version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memoir
      POSTGRES_USER: memoir
      POSTGRES_PASSWORD: memoir
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Only localhost: never publish the dev database to the network
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoir"]
      interval: 10s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://memoir:memoir@postgres:5432/memoir
      SECRET_KEY: dev-secret
      DEBUG: "true"
      ALLOW_REGISTRATION: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
        VITE_ALLOW_REGISTRATION: "true"
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
